name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if this version already exists in the registry"
        type: boolean
        default: false

env:
  ACR_REGISTRY: firebranddevet.azurecr.io
  IMAGE_NAME: ff-services-pymupdf
  LEGACY_IMAGE_NAME: doc-proc-pymupdf

jobs:
  build-and-push-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' pyproject.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Image tag: $VERSION"

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: firebranddevet
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Validate version uniqueness
        if: github.ref_name == 'main' && !inputs.force
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if docker manifest inspect "${{ env.ACR_REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}:${VERSION}" >/dev/null 2>&1 \
            || docker manifest inspect "${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}" >/dev/null 2>&1; then
            echo "Error: image tag ${VERSION} already exists in the registry."
            echo "Increment the version in pyproject.toml, or dispatch with force=true to republish."
            exit 1
          fi
          echo "Version ${VERSION} is available."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # provenance/sbom off and a single platform: the tag resolves directly to an image
      # manifest, with no untagged attestation or per-platform children that an
      # untagged-manifest purge could delete.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
            ${{ env.ACR_REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}:latest
